<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - DSQA Document Traceability and Configuration Management Tool</title>
  <style>
    /* ── WATERMARK ── */
    .center {
    position: relative !important;
    min-height: 400px; /* Forces container visibility */
    }

    .center::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        /* INCREASE THESE VALUES */
        width: 900px;  /* Try 600px, 800px, etc. */
        height: 900px; /* Keep height equal to width to preserve square ratio */

        /* Or use percentages relative to the parent container: */
        /* width: 80%; */
        /* height: 80%; */

        background-image: url('../logo.png'); /* Your fixed path */
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain; /* Ensures logo fits within width/height without cropping */
        opacity: 0.10;
        pointer-events: none;
        z-index: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #dbecff;
    }

    /* ── TOP BAR ── */
    .top-bar {
      background: #1e4d7b;
      border-bottom: 1px solid #c9a84c;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      height: 56px;
    }

    .top-bar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      position: absolute;
      left: 20px;
    }

    .top-bar-logo img {
      height: 40px;
      width: 40px;
    }

    .top-bar-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #f0e6c8;
    }

    /* ── CENTER ── */
    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow:hidden;
    }

    /* ── LOGIN BOX ── */
    .login-box {
      background: #fcfdf7;
      border: 1px solid #163a5f;
      padding: 35px 40px;
      width: 360px;
      position:relative;
      z-index:1;
    }

    .login-box h2 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      height: 32px;
      padding: 4px 10px;
      border: 1px solid #999;
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      background: white;
    }

    .form-group input:focus { outline: 1px solid #c9a84c; }

    .role-group { margin-bottom: 20px; }

    .role-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .role-options {
      display: flex;
      gap: 30px;
    }

    .role-option {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      cursor: pointer;
    }

    .role-option input[type="radio"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 9px;
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: #ffffff;
      background: #1e4d7b;
      border: 1px solid #163a5f;
      margin-top: 6px;
    }

    .login-btn:hover { background: #0e7c7b; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      display: none;
      color: red;
      font-weight: bold;
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
    }

    /* ── FOOTER ── */
    .footer {
      background: #163a5f;
      border-top: 1px solid #c9a84c;
      padding: 6px 20px;
      text-align: right;
      font-size: 12px;
      color: #c9a84c;
      font-family: 'Times New Roman', serif;
      flex-shrink: 0;
    }

  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-bar-logo">
      <img src="logo.png" alt="Logo"/>
    </div>
    <div class="top-bar-title">DSQA Document Traceability and Configuration Management Tool</div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="login-box">
      <h2>Login</h2>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username"
               onkeydown="if(event.key==='Enter') doLogin()"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password"
               onkeydown="if(event.key==='Enter') doLogin()"/>
      </div>

      <div class="role-group">
        <label>Role</label>
        <div class="role-options">
          <label class="role-option">
            <input type="radio" name="role" value="user" checked/>
            User
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="admin"/>
            Administrator
          </label>
        </div>
      </div>

      <button class="login-btn" id="login-btn" onclick="doLogin()">
        Login
      </button>

      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    DSQA&nbsp;|&nbsp;DRDO
  </div>

  <script>

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const role     = document.querySelector('input[name="role"]:checked').value;
      const errorMsg = document.getElementById('error-msg');
      const btn      = document.getElementById('login-btn');

      errorMsg.style.display = 'none';

      if (!username || !password) {
        errorMsg.textContent   = 'Please enter username and password.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Logging in...';

      try {
        const response = await fetch(window.location.origin + '/login', {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ username, password, role })
        });

        const result = await response.json();

        if (result.success) {
          sessionStorage.setItem('username', result.username);
          sessionStorage.setItem('role',     result.role);
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent   = result.error || 'Invalid username, password or role.';
          errorMsg.style.display = 'block';
        }

      } catch (err) {
        errorMsg.textContent   = 'Could not connect to server. Make sure node server.js is running.';
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Login';
      }
    }

  </script>
</body>
</html>
