<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Search Results</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      background: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .info-bar {
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
      padding: 14px 20px;
      flex-shrink: 0;
    }

    .info-bar h2 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .info-bar p {
      font-size: 13px;
      color: #444;
    }

    .table-area {
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      background: #d4d4d4;
      border: 1px solid #999;
      padding: 8px 10px;
      text-align: left;
      font-weight: bold;
      white-space: nowrap;
    }

    tbody td {
      border: 1px solid #ccc;
      padding: 7px 10px;
      vertical-align: middle;
    }

    tbody tr:hover { background: #f5f5f5; }


    .open-btn,
    .edit-btn,
    .delete-btn,
    .save-btn,
    .cancel-btn {
      padding: 3px 10px;
      font-family: 'Times New Roman', serif;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #999;
      background: #d4d4d4;
      margin-right: 3px;
    }

    .open-btn:hover   { background: #c0c0c0; }
    .edit-btn         { border-color: #0066cc; color: #0066cc; }
    .edit-btn:hover   { background: #e0eeff; }
    .delete-btn       { border-color: #c00; color: #c00; }
    .delete-btn:hover { background: #ffe0e0; }
    .save-btn         { border-color: #007700; color: #007700; }
    .save-btn:hover   { background: #e0ffe0; }
    .cancel-btn:hover { background: #c0c0c0; }

    .open-btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .edit-row td {
      background: #f5f8ff;
      border: 1px solid #99b3dd;
      padding: 8px 10px;
    }

    .edit-row input {
      width: 100%;
      height: 28px;
      padding: 3px 7px;
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      border: 1px solid #999;
      background: white;
    }

    .edit-row input:focus {
      outline: 1px solid #0066cc;
    }

    .empty-row td {
      text-align: center;
      color: #888;
      padding: 30px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error-box {
      display: none;
      margin: 20px;
      padding: 14px;
      border: 1px solid #e0a0a0;
      background: #fdecec;
      color: #a02020;
      font-weight: bold;
    }

    .bottom-bar {
      background: #f0f0f0;
      border-top: 1px solid #ccc;
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .bottom-bar button {
      padding: 6px 18px;
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #999;
      background: #d4d4d4;
    }
    .bottom-bar button:hover { background: #c0c0c0; }

  </style>
</head>
<body>


  <div class="info-bar">
    <h2>Search Results</h2>
    <p id="search-info">Loading...</p>
  </div>

  <div class="table-area">
    <div class="loading" id="loading">Searching...</div>
    <div class="error-box" id="error-box">
      Could not connect to the server.
      Make sure <code>node server.js</code> is running.
    </div>

    <table id="results-table" style="display:none">
      <thead>
        <tr>
          <th>Project Name</th>
          <th>Sub System</th>
          <th>Mission</th>
          <th>Document Type</th>
          <th>Version</th>
          <th>Version Date</th>
          <th>Submission Date</th>
          <th>File Name</th>
          <th> </th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>

  <div class="bottom-bar">
    <button onclick="window.close()">Close</button>
  </div>

  <script>

    const SERVER_URL = window.location.origin;


    const params      = new URLSearchParams(window.location.search);
    const projectName = params.get('projectName') || '';
    const subsystem   = params.get('subsystem')   || '';
    const mission     = params.get('mission')     || '';
    const version     = params.get('version')     || '';
    const docType     = params.get('docType')     || 'All';
    const role        = params.get('role')        || 'user';

    document.getElementById('search-info').textContent =
      'Project: '           + projectName +
      '   |   Sub System: ' + subsystem   +
      '   |   Mission: '    + mission     +
      '   |   Version: '    + version     +
      '   |   Document: '   + docType;

    async function loadResults() {
      try {
        const query = new URLSearchParams({
          projectName, subsystem, mission, version, docType
        });

        const response = await fetch(SERVER_URL + '/search?' + query.toString());
        if (!response.ok) throw new Error('Server error');

        const results = await response.json();

        document.getElementById('loading').style.display       = 'none';
        document.getElementById('results-table').style.display = 'table';

        const tbody = document.getElementById('results-body');
        tbody.innerHTML = '';

        if (results.length === 0) {
          tbody.innerHTML = `
            <tr class="empty-row">
              <td colspan="9">
                No documents found for the given search criteria.
              </td>
            </tr>`;
          return;
        }

        results.forEach(row => buildRow(row));

      } catch (err) {
        document.getElementById('loading').style.display   = 'none';
        document.getElementById('error-box').style.display = 'block';
        console.error('Search error:', err);
      }
    }

    function buildRow(row) {
      const tbody = document.getElementById('results-body');
      const tr    = document.createElement('tr');
      tr.setAttribute('data-projectid', row.projectId);
      tr.setAttribute('data-docid',     row.docId);

      tr.innerHTML = `
        <td>${row.projectName      || ''}</td>
        <td>${row.projectSubsystem || ''}</td>
        <td>${row.mission          || ''}</td>
        <td>${row.docType          || ''}</td>
        <td>${row.version          || ''}</td>
        <td>${row.versionDate      || ''}</td>
        <td>${row.submissionDate   || ''}</td>
        <td>${row.fileName || row.filePath || 'No file'}</td>
        <td></td>`;

      const actionCell = tr.children[tr.children.length - 1];

      const openBtn       = document.createElement('button');
      openBtn.className   = 'open-btn';
      openBtn.textContent = 'Open';

      if (!row.filePath) {
        openBtn.disabled    = true;
        openBtn.textContent = 'No File';
      } else {
        openBtn.addEventListener('click', () => {
          const filename = row.filePath.split('/').pop();
          const viewUrl  = SERVER_URL + '/view-file/' + filename;

          fetch(viewUrl, { method: 'HEAD' })
            .then(resp => {
              if (resp.ok) {
                window.open(viewUrl, '_blank');
              } else {
                alert('File not found on server.\nPlease try uploading the document again.');
              }
            })
            .catch(() => {
              alert('Could not reach the server. Make sure node server.js is running.');
            });
        });
      }
      actionCell.appendChild(openBtn);

      if (role === 'admin') {
        const editBtn       = document.createElement('button');
        editBtn.className   = 'edit-btn';
        editBtn.textContent = 'Edit';

        editBtn.addEventListener('click', () => {
          showEditRow(tr, row);
        });

        actionCell.appendChild(editBtn);
      }

      if (role === 'admin') {
        const delBtn       = document.createElement('button');
        delBtn.className   = 'delete-btn';
        delBtn.textContent = 'Delete';

        delBtn.addEventListener('click', () => {
          const confirmed = confirm(
            'Are you sure you want to delete this document?\n\n' +
            'Document Type: ' + (row.docType     || '') + '\n' +
            'File: '          + (row.fileName    || '') + '\n' +
            'Project: '       + (row.projectName || '') + '\n\n' +
            'This action cannot be undone.'
          );

          if (!confirmed) return;

          fetch(SERVER_URL + '/delete-document/' + row.docId, {
            method: 'DELETE'
          })
          .then(res => res.json())
          .then(result => {
            if (result.success) {
              tr.remove();
              alert('Document deleted successfully.');
            } else {
              alert('Could not delete: ' + (result.error || 'Unknown error'));
            }
          })
          .catch(() => alert('Could not connect to server.'));
        });

        actionCell.appendChild(delBtn);
      }

      tbody.appendChild(tr);
    }


    function showEditRow(tr, row) {

  
      const existingEdit = document.querySelector('.edit-row');
      if (existingEdit) existingEdit.remove();


      const editTr = document.createElement('tr');
      editTr.className = 'edit-row';

      editTr.innerHTML = `
        <td>
          <input type="text" id="edit-projectName"
                 value="${row.projectName || ''}"
                 placeholder="Project Name"/>
        </td>
        <td>
          <input type="text" id="edit-subsystem"
                 value="${row.projectSubsystem || ''}"
                 placeholder="Sub System"/>
        </td>
        <td>
          <input type="text" id="edit-mission"
                 value="${row.mission || ''}"
                 placeholder="Mission"/>
        </td>
        <td colspan="5" style="color:#666; font-size:12px;">
          Only Project Name, Sub System and Mission can be edited here.
        </td>
        <td>
          <button class="save-btn"   id="save-btn">Save</button>
          <button class="cancel-btn" id="cancel-btn">Cancel</button>
        </td>`;

      
      tr.insertAdjacentElement('afterend', editTr);
   
 
      document.getElementById('edit-projectName').focus();

      document.getElementById('cancel-btn').addEventListener('click', () => {
        editTr.remove();
      });

      document.getElementById('save-btn').addEventListener('click', async () => {

        const newProjectName = document.getElementById('edit-projectName').value.trim();
        const newSubsystem   = document.getElementById('edit-subsystem').value.trim();
        const newMission     = document.getElementById('edit-mission').value.trim();

        if (!newProjectName || !newSubsystem) {
          alert('Project Name and Sub System cannot be empty.');
          return;
        }

        const projectId = tr.getAttribute('data-projectid');

        try {
          const response = await fetch(
            SERVER_URL + '/update-project/' + projectId,
            {
              method : 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body   : JSON.stringify({
                projectName: newProjectName,
                subsystem  : newSubsystem,
                mission    : newMission
              })
            }
          );

          const result = await response.json();

          if (result.success) {
            // Update the visible cells in the original row
            tr.children[0].textContent = newProjectName;
            tr.children[1].textContent = newSubsystem;
            tr.children[2].textContent = newMission;

            // Remove the edit row
            editTr.remove();

            alert('Project updated successfully.');

          } else {
            alert('Could not update: ' + (result.error || 'Unknown error'));
          }

        } catch (err) {
          alert('Could not connect to server. Make sure node server.js is running.');
        }
      });


      editTr.querySelectorAll('input').forEach(input => {
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter')  document.getElementById('save-btn').click();
          if (e.key === 'Escape') document.getElementById('cancel-btn').click();
        });
      });
    }

    loadResults();

  </script>
</body>
</html>
