<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Document Browser</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .top-bar {
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .top-bar-title { flex: 1; text-align: center; }

    .top-bar-user {
      font-size: 13px;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .role-badge {
      padding: 2px 10px;
      border: 1px solid #999;
      background: #e8e8e8;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .logout-btn {
      padding: 3px 12px;
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #999;
      background: #d4d4d4;
    }
    .logout-btn:hover { background: #c0c0c0; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    
    .left-panel {
      width: 200px;
      background: #e8e8e8;
      border-right: 2px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      gap: 12px;
      flex-shrink: 0;
    }

    .left-panel button {
      width: 160px;
      padding: 8px 10px;
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #d4d4d4;
      border: 1px solid #999;
    }

    .left-panel button:hover { background: #c0c0c0; }
    .left-panel button.active-btn {
      background: #b0b0b0;
      border: 2px solid #666;
    }
    .right-panel {
      flex: 1;
      overflow-y: auto;
      background: white;
    }

    .page { display: none; padding: 30px; }
    .page.active { display: block; }

    
    .welcome-page {
      display: none;
      height: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .welcome-page.active { display: flex; }
    .welcome-page h1 {
      font-size: 40px;
      font-weight: bold;
    }

    .page h2 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select {
      width: 300px;
      height: 30px;
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      padding: 4px 8px;
      border: 1px solid #999;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus { outline: 1px solid #666; }


    
    .file-row { display: flex; align-items: center; gap: 8px; }

    .file-name-display {
      width: 215px;
      height: 30px;
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      padding: 4px 8px;
      border: 1px solid #999;
      background: #f5f5f5;
      color: #555;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .file-row button {
      height: 30px;
      padding: 0 12px;
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #999;
      background: #d4d4d4;
    }
    .file-row button:hover { background: #c0c0c0; }

    
    .btn {
      margin-top: 16px;
      padding: 7px 20px;
      font-family: 'Times New Roman', serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #999;
      background: #d4d4d4;
    }
    .btn:hover { background: #c0c0c0; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }

    .success-msg {
      display: none;
      margin-top: 14px;
      color: green;
      font-weight: bold;
    }
    .error-msg {
      display: none;
      margin-top: 14px;
      color: red;
      font-weight: bold;
    }

    
    .loading-hint {
      font-size: 12px;
      color: #888;
      font-style: italic;
      margin-top: 4px;
    }

  </style>
</head>
<body>


  <div class="top-bar">
    <div style="width:200px"></div>
    <div class="top-bar-title">Project Document Browser</div>
    <div class="top-bar-user">
      <span id="display-username"></span>
      <span class="role-badge" id="display-role"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">

   
    <div class="left-panel">
      
      <button id="btn-search" onclick="showPage('search', this)">
        Search Project
      </button>
      <button id="btn-add" onclick="showPage('add', this)"
              style="display:none">
        Add Files
      </button>
    </div>

    <div class="right-panel">


      <div class="welcome-page active" id="page-welcome">
        <div>
          <h1>Project Document Browser</h1>
          <p id="welcome-msg"
             style="margin-top:14px;font-size:16px;color:#555;text-align:center;">
          </p>
        </div>
      </div>

      
      <div class="page" id="page-search">
        <h2>Search Project</h2>

        <div class="form-group">
          <label>Project Name</label>

     
          <select id="s-projectName-dropdown" style="display:none">
            <option value="">-- Select Project --</option>
          </select>

          <input type="text" id="s-projectName-text"/>

          <div class="loading-hint" id="s-projectName-hint"
               style="display:none">
            Loading projects...
          </div>
        </div>

        <div class="form-group">
          <label>Sub System</label>
          <select id="s-subsystem-dropdown" style="display:none">
            <option value="">-- Select Sub System --</option>
          </select>

          <input type="text" id="s-subsystem-text"/>
        </div>


        <div class="form-group">
          <label>Mission</label>

          <select id="s-mission-dropdown" style="display:none">
            <option value="">-- Select Mission --</option>
          </select>

          <input type="text" id="s-mission-text"/>
        </div>

        <div class="form-group">
          <label>Version</label>
          <input type="text" id="s-version"/>
        </div>

        <div class="form-group">
          <label>Document</label>
          <select id="s-docType">
            <option value="All">All</option>
            <option>SRS</option>
            <option>SDD</option>
            <option>ICD</option>
            <option>Change Note</option>
            <option>Resource List</option>
            <option>Observation Reports</option>
            <option>Reply Report</option>
            <option>Certificates</option>
            <option>Technical Notes</option>
          </select>
        </div>

        <button class="btn" onclick="runSearch()">Search</button>

        <div class="error-msg" id="search-error">
          Please select or enter a Project Name to search.
        </div>
      </div>

 
      <div class="page" id="page-add">
        <h2>Add File</h2>

        <div class="form-group">
          <label>Project Name</label>
          <input type="text" id="a-projectName"/>
        </div>

        <div class="form-group">
          <label>Sub System</label>
          <input type="text" id="a-subsystem"/>
        </div>

        <div class="form-group">
          <label>Mission</label>
          <input type="text" id="a-mission"/>
        </div>

        <div class="form-group">
          <label>Document Type</label>
          <select id="a-docType">
            <option value="">-- Select --</option>
            <option>SRS</option>
            <option>SDD</option>
            <option>ICD</option>
            <option>Change Note</option>
            <option>Resource List</option>
            <option>Observation Reports</option>
            <option>Reply Report</option>
            <option>Certificates</option>
            <option>Technical Notes</option>
          </select>
        </div>

        <div class="form-group">
          <label>Version</label>
          <input type="text" id="a-version"/>
        </div>

        <div class="form-group">
          <label>Version Date</label>
          <input type="date" id="a-versionDate" style="width:300px;"/>
        </div>

        <div class="form-group">
          <label>Submission Date</label>
          <input type="date" id="a-submissionDate" style="width:300px;"/>
        </div>

        <div class="form-group">
          <label>File</label>
          <div class="file-row">
            <div class="file-name-display" id="a-fileNameDisplay">
              No file selected
            </div>
            <button onclick="document.getElementById('file-input').click()">
              Browse
            </button>
          </div>
          <input type="file" id="file-input" style="display:none"
                 accept=".pdf,.doc,.docx,.xlsx,.pptx"
                 onchange="handleFilePick(this)"/>
        </div>

        <button class="btn" id="submit-btn" onclick="submitDoc()">
          Submit
        </button>

        <div class="success-msg" id="add-success">
          Document added successfully!
        </div>
        <div class="error-msg" id="add-error">
          Please fill in Project Name and Sub System.
        </div>
      </div>

    </div>
  </div>

  <script>

    const SERVER_URL = window.location.origin;

    // session check
    const username = sessionStorage.getItem('username');
    const role     = sessionStorage.getItem('role');

    if (!username || !role) {
      window.location.href = 'login.html';
    }

    document.getElementById('display-username').textContent = username;
    document.getElementById('display-role').textContent     = role;


    if (role === 'user') {


      document.getElementById('btn-add').style.display = 'block';

      document.getElementById('s-projectName-dropdown').style.display = 'block';
      document.getElementById('s-subsystem-dropdown').style.display   = 'block';
      document.getElementById('s-mission-dropdown').style.display     = 'block';
      document.getElementById('s-projectName-text').style.display     = 'none';
      document.getElementById('s-subsystem-text').style.display       = 'none';
      document.getElementById('s-mission-text').style.display         = 'none';

      loadDropdownOptions();

    } else {

      document.getElementById('s-projectName-dropdown').style.display = 'block';
      document.getElementById('s-subsystem-dropdown').style.display   = 'block';
      document.getElementById('s-mission-dropdown').style.display     = 'block';
      document.getElementById('s-projectName-text').style.display     = 'none';
      document.getElementById('s-subsystem-text').style.display       = 'none';
      document.getElementById('s-mission-text').style.display         = 'none';

      loadDropdownOptions();
    }


    async function loadDropdownOptions() {

      document.getElementById('s-projectName-hint').style.display = 'block';

      try {
        const response = await fetch(SERVER_URL + '/get-projects');
        if (!response.ok) throw new Error('Server error');

        const projects = await response.json();

        const projectNames = [...new Set(projects.map(p => p.projectName).filter(Boolean))];
        const subsystems   = [...new Set(projects.map(p => p.subsystem).filter(Boolean))];
        const missions     = [...new Set(projects.map(p => p.mission).filter(Boolean))];

        const projDropdown = document.getElementById('s-projectName-dropdown');
        projectNames.forEach(name => {
          const opt = document.createElement('option');
          opt.value       = name;
          opt.textContent = name;
          projDropdown.appendChild(opt);
        });

        const subDropdown = document.getElementById('s-subsystem-dropdown');
        subsystems.forEach(sub => {
          const opt = document.createElement('option');
          opt.value       = sub;
          opt.textContent = sub;
          subDropdown.appendChild(opt);
        });


        const misDropdown = document.getElementById('s-mission-dropdown');
        missions.forEach(mis => {
          const opt = document.createElement('option');
          opt.value       = mis;
          opt.textContent = mis;
          misDropdown.appendChild(opt);
        });

        document.getElementById('s-projectName-hint').style.display = 'none';

      } catch (err) {
        document.getElementById('s-projectName-hint').textContent =
          'Could not load projects. Make sure server is running.';
        console.error('Dropdown load error:', err);
      }
    }

    function getSearchValues() {
      if (role === 'user') {
        return {
          projectName: document.getElementById('s-projectName-dropdown').value,
          subsystem  : document.getElementById('s-subsystem-dropdown').value,
          mission    : document.getElementById('s-mission-dropdown').value
        };
      } else {
        return {
          projectName: document.getElementById('s-projectName-text').value.trim(),
          subsystem  : document.getElementById('s-subsystem-text').value.trim(),
          mission    : document.getElementById('s-mission-text').value.trim()
        };
      }
    }


    function logout() {
      sessionStorage.clear();
      window.location.href = 'login.html';
    }

    function showPage(name, clickedBtn) {
      document.getElementById('page-welcome').classList.remove('active');
      document.getElementById('page-search').classList.remove('active');
      document.getElementById('page-add').classList.remove('active');
      document.getElementById('page-' + name).classList.add('active');
      document.querySelectorAll('.left-panel button')
              .forEach(b => b.classList.remove('active-btn'));
      clickedBtn.classList.add('active-btn');
      hideMessages();
    }

    function runSearch() {
      const { projectName, subsystem, mission } = getSearchValues();
      const version = document.getElementById('s-version').value.trim();
      const docType = document.getElementById('s-docType').value;

      if (projectName === '') {
        document.getElementById('search-error').style.display = 'block';
        return;
      }
      document.getElementById('search-error').style.display = 'none';

      const params = new URLSearchParams({
        projectName, subsystem, mission, version, docType, role
      });

      window.open(
        'results.html?' + params.toString(),
        '_blank',
        'width=1100,height=520,top=80,left=80,resizable=yes,scrollbars=yes'
      );
    }

    let selectedFile = null;

    function handleFilePick(input) {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('a-fileNameDisplay').textContent =
          selectedFile.name;
      }
    }

    async function submitDoc() {
      const projectName    = document.getElementById('a-projectName').value.trim();
      const subsystem      = document.getElementById('a-subsystem').value.trim();
      const mission        = document.getElementById('a-mission').value.trim();
      const docType        = document.getElementById('a-docType').value;
      const version        = document.getElementById('a-version').value.trim();
      const versionDate    = document.getElementById('a-versionDate').value;
      const submissionDate = document.getElementById('a-submissionDate').value;

      if (projectName === '' || subsystem === '') {
        document.getElementById('add-error').style.display   = 'block';
        document.getElementById('add-success').style.display = 'none';
        return;
      }
      document.getElementById('add-error').style.display = 'none';

      const formData = new FormData();
      formData.append('projectName',    projectName);
      formData.append('subsystem',      subsystem);
      formData.append('mission',        mission);
      formData.append('docType',        docType);
      formData.append('version',        version);
      formData.append('versionDate',    versionDate);
      formData.append('submissionDate', submissionDate);
      formData.append('uploadedBy',     username);

      if (selectedFile) {
        formData.append('file', selectedFile);
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled    = true;
      btn.textContent = 'Uploading...';

      try {
        const response = await fetch(SERVER_URL + '/add-document', {
          method: 'POST',
          body  : formData
        });
        const result = await response.json();

        if (result.success) {
          document.getElementById('add-success').style.display = 'block';
          setTimeout(() => {
            document.getElementById('add-success').style.display = 'none';
          }, 3000);
          clearAddForm();

     
          if (role === 'user') refreshDropdowns();

        } else {
          alert('Error: ' + (result.error || 'Could not add document.'));
        }

      } catch (err) {
        alert('Could not connect to server. Make sure node server.js is running.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Submit';
      }
    }

    async function refreshDropdowns() {
      try {
        const response = await fetch(SERVER_URL + '/get-projects');
        const projects = await response.json();

        const projectNames = [...new Set(projects.map(p => p.projectName).filter(Boolean))];
        const subsystems   = [...new Set(projects.map(p => p.subsystem).filter(Boolean))];
        const missions     = [...new Set(projects.map(p => p.mission).filter(Boolean))];

        rebuildDropdown('s-projectName-dropdown', projectNames, '-- Select Project --');
        rebuildDropdown('s-subsystem-dropdown',   subsystems,   '-- Select Sub System --');
        rebuildDropdown('s-mission-dropdown',     missions,     '-- Select Mission --');

      } catch (err) {
        console.error('Dropdown refresh error:', err);
      }
    }

    function rebuildDropdown(id, values, defaultLabel) {
      const dropdown = document.getElementById(id);
      dropdown.innerHTML = `<option value="">${defaultLabel}</option>`;
      values.forEach(val => {
        const opt       = document.createElement('option');
        opt.value       = val;
        opt.textContent = val;
        dropdown.appendChild(opt);
      });
    }
    function clearAddForm() {
      document.getElementById('a-projectName').value    = '';
      document.getElementById('a-subsystem').value      = '';
      document.getElementById('a-mission').value        = '';
      document.getElementById('a-docType').value        = '';
      document.getElementById('a-version').value        = '';
      document.getElementById('a-versionDate').value    = '';
      document.getElementById('a-submissionDate').value = '';
      document.getElementById('a-fileNameDisplay').textContent = 'No file selected';
      document.getElementById('file-input').value = '';
      selectedFile = null;
    }

    function hideMessages() {
      document.getElementById('search-error').style.display  = 'none';
      document.getElementById('add-success').style.display   = 'none';
      document.getElementById('add-error').style.display     = 'none';
    }

  </script>
</body>
</html>
